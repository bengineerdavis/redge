[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.1"

[[repos.hooks]]
id = "ruff"
args = [
    "--fix",
]

[[repos.hooks]]
id = "ruff-format"

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.2.0"

[[repos.hooks]]
id = "tombi-lint"
args = [
    "--offline",
]

[[repos.hooks]]
id = "tombi-format"
args = [
    "--offline",
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "alint-check"
name = "alint check"
entry = "alint check"
language = "system"
pass_filenames = false
always_run = true
