[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redge-cli"
version = "0.0.1"
description = "Repositories as a package manager: declarative catalogue, update/upgrade/lock split, safe one-way fast-forward, named groups, pluggable registry discovery."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "FSL-1.1-MIT" }
license-files = ["LICENSE*"]
authors = [{ name = "Ben Davis", email = "bengineerdavis@gmail.com" }]
keywords = ["cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]

dependencies = [
  "typer>=0.12",
]

[project.scripts]
redge = "redge.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "mypy>=1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/redge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
