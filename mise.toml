[tools]
python = "3.12"
uv = "latest"
# agentic layer tools — backends verified 2026-10-18 (layer fragment fix 4a3e0ea)
"npm:@sentry/dotagents" = "latest"
"github:asamarts/alint" = "latest"
"github:kenn-io/roborev" = "latest"
prek = "0.5.2"
tombi = "1.5.5"
opencode = "1.18.32"
worktrunk = "0.80.0"

[tasks.test]
description = "Run tests (uv auto-syncs the venv first)"
run = "uv run pytest"

[tasks.lint]
description = "Ruff lint"
run = "uv run ruff check src tests"

[tasks.format]
description = "Auto-fix lint findings and format"
run = "#!/usr/bin/env bash\nset -euo pipefail\nuv run ruff check --fix src tests\nuv run ruff format src tests\n"

[tasks.format-check]
description = "Verify formatting and lint cleanliness"
run = "#!/usr/bin/env bash\nset -euo pipefail\nuv run ruff format --check src tests\nuv run ruff check src tests\n"

[tasks.type-check]
description = "Mypy over src"
run = "uv run mypy src"

[tasks.quality]
description = "All code-quality gates (lint, format, types)"
depends = [
    "lint",
    "format-check",
    "type-check",
]

[tasks.install]
description = "Bootstrap agentic layer: tools, managed state, hooks"
run = "#!/usr/bin/env bash\nset -euo pipefail\n: \"${TMPDIR:=/tmp}\"\nif [ -d \"$TMPDIR/fslock\" ] && [ ! -w \"$TMPDIR/fslock\" ]; then\n  echo \"ERROR: $TMPDIR/fslock is not writable by $(whoami) — aube (mise npm backend) will fail to lock.\" >&2\n  echo \"  fix: sudo chown -R \\\"$(id -un):$(id -gn)\\\" \\\"$TMPDIR/fslock\\\"   # or: export TMPDIR=<user-owned dir>\" >&2\n  exit 1\nfi\nmise install prek tombi opencode\nmise install \"npm:@sentry/dotagents\"\ndotagents --project install\nprek install --force\nif ! mise install \"github:kenn-io/roborev\"; then\n  echo \"warn: roborev install failed (backend unverified)\" >&2\nfi\nif ! roborev init; then\n  echo \"warn: roborev init failed (no git repo yet, or daemon unavailable)\" >&2\nfi\nmise run backlog-init\n"

[tasks.backlog-init]
description = "Initialize the backlog task store (idempotent)"
run = "#!/usr/bin/env bash\nset -euo pipefail\nif [ -f backlog/config.yml ]; then\n  echo \"backlog already initialized\"\n  exit 0\nfi\nuvx --from backlog-md-py backlog-py init --defaults\n"

[tasks.dotagents-install]
description = "Refresh dotagents managed state (skills, MCP, subagents)"
run = "dotagents --project install"

[tasks.roborev-start]
description = "Ensure the roborev review daemon is running"
run = "roborev start 2>/dev/null || roborev serve 2>/dev/null || true"

[tasks.roborev-status]
description = "Show open fast-loop findings for the current branch"
run = "roborev status"

[tasks.roborev-fix]
description = "Hand open findings back to the live agent (fix while fresh)"
run = "roborev fix"

[tasks.review-deep]
description = "Slow loop: deep review of the working branch, report to docs/reviews/"
run = "#!/usr/bin/env bash\nset -euo pipefail\nmkdir -p docs/reviews\nopencode run --agent review-deep \"Run the review-deep agent procedure for this repository.\"\n"

[tasks.check]
description = "Structure enforcement: alint + tombi lint"
run = "#!/usr/bin/env bash\nset -euo pipefail\nalint check\ntombi lint mise.toml\n"
